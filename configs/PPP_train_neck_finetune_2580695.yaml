# Weights-only refinement from job 2580695 epoch 75; fresh AdamW and short warmup.
data:
  dataset_dir: /e/scratch/nxtaim-1/public/truckscenes/man-truckscenes
  ppp_data_dir: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  ppp_manifest_path: output/ppp_manifests/truckscenes_train.json
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenPPPDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.2-trainval
    ppp_scene_tokens: null
    ppp_processing_signature: 22b8e2aa32ac33f9ebd50fda28a5e1fde16df5377c85b179f4b6a191dd6ffad6
    camera_freq: 10.0
    camera_views: [CAMERA_RIGHT_FRONT, CAMERA_LEFT_FRONT, CAMERA_RIGHT_BACK, CAMERA_LEFT_BACK]
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0

model:
  model: NeckPPP
  image_size: 512
  mixed_precision: bf16
  resume_from: null
  extra:
    embed_dim: 384
    neck_layers: 12
    neck_heads: 6
    stem_channels: [32, 64, 128]
    stage_channels: [128, 64, 32, 16]
    local_refine_blocks: 2
    use_skip_connections: true

train:
  num_workers: 8
  seed: 42
  train_batch_size: 160
  training_hours: 7.5
  num_epochs: 96
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    lr: 3.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.01
  # 100-update warmup; 29 epochs at 3e-4, 38 at 1e-4, 29 at 3e-5.
  lr_schedule: epoch_step
  lr_schedule_args:
    num_warmup_steps: 100
    switch_epochs: [29, 67]
    factors: [0.3333333333333333, 0.1]
  auto_lr:
    rule: none
  log_interval: 20
  save_model_epochs: 10
  save_model_steps: 1000
  work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_train_neck_finetune_2580695
  online_metric: false
  extra:
    ppp_weight: 1.0
    rcs_weight: 1.0
    doppler_weight: 1.0
    normalize_ppp_by_gt_count: true
    velocity_loss_mode: signed_l1
    mark_link: identity
    conditioning_dropout: 0.0
    persistent_workers: true
    overfit_diagnostic_interval: 0
    lr_range_test: false
    keep_last_checkpoints: 30  # Retain refinement checkpoints for validation.
    prediction_interval: 2000
    prediction_random_sample: true

work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_train_neck_finetune_2580695
name: PPP_train_neck_finetune_2580695
tracker_project_name: train_radargen_ppp
report_to: none
resume_from: null

tensorboard: true
