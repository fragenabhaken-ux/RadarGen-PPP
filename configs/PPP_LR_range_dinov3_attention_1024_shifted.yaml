# Four-GPU LR sweep for the 1152-channel shifted-window DINOv3 variant.
# Batch 24/GPU (effective 96); estimated ~69 GiB, verified by a five-update DDP probe.
data:
  dataset_dir: /e/scratch/nxtaim-1/public/truckscenes/man-truckscenes
  ppp_data_dir: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  ppp_manifest_path: output/ppp_manifests/truckscenes_train.json
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenPPPDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.2-trainval
    ppp_scene_tokens: null
    ppp_processing_signature: 22b8e2aa32ac33f9ebd50fda28a5e1fde16df5377c85b179f4b6a191dd6ffad6
    camera_freq: 10.0
    camera_views: [CAMERA_RIGHT_FRONT, CAMERA_LEFT_FRONT, CAMERA_RIGHT_BACK, CAMERA_LEFT_BACK]
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0

model:
  model: DinoPPP
  image_size: 512
  mixed_precision: bf16
  resume_from: null
  extra:
    model_name: vit_small_patch16_dinov3
    checkpoint_path: /e/project1/nxtaim-1/huber7/pretrained/vit_small_patch16_dinov3.lvd1689m/model.safetensors
    # Train shared RGB DINO weights and retain the modality-specific LoRA adapters.
    frozen_base: false
    use_lora: true
    lora_r: 16
    lora_alpha: 32.0
    out_indices: [11]
    feature_fusion: last_concat
    embed_dim: 1152
    neck_layers: 12
    neck_heads: 9
    decoder: attention
    output_scale: 2
    attention_channels: [128, 64, 32]
    attention_blocks: 2
    attention_heads: 4
    attention_window_size: 8
    attention_projection_kernel_size: 3
    attention_shifted_windows: true
    local_refine_blocks: 2

train:
  num_workers: 4
  seed: 42
  train_batch_size: 24
  num_epochs: 2
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    lr: 1.0e-7
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.01
  # Actual optimizer LR increases every successful update, without warmup.
  lr_schedule: exponential
  lr_schedule_args:
    end_lr: 1.0e-2
    updates: 600
  auto_lr:
    rule: none
  log_interval: 1
  save_model_epochs: 0
  save_model_steps: 10000
  work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_LR_range_dinov3_attention_1024_shifted
  online_metric: false
  extra:
    ppp_weight: 1.0
    rcs_weight: 1.0
    doppler_weight: 1.0
    normalize_ppp_by_gt_count: true
    velocity_loss_mode: signed_l1
    conditioning_dropout: 0.0
    overfit_diagnostic_interval: 0
    lr_range_test: true
    save_checkpoints: false
    log_step_timing: true
    keep_last_checkpoints: 5  # Retain only the latest five numbered checkpoints.
    prediction_interval: 200
    prediction_random_sample: false
    prediction_indices: [0, 100, 1000]

work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_LR_range_dinov3_attention_1024_shifted
name: PPP_LR_range_dinov3_attention_1024_shifted
tracker_project_name: train_radargen_ppp
report_to: none
resume_from: null

# Disposable sweep: standalone diagnostics, no model checkpoints.
tensorboard: false
