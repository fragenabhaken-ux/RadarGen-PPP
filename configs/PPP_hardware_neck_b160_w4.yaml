# CNN stem with multiscale skips, transformer neck and direct physical marks.
data:
  dataset_dir: /e/scratch/nxtaim-1/public/truckscenes/man-truckscenes
  ppp_data_dir: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  ppp_manifest_path: output/ppp_manifests/truckscenes_train.json
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenPPPDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.2-trainval
    ppp_scene_tokens: null
    ppp_processing_signature: 22b8e2aa32ac33f9ebd50fda28a5e1fde16df5377c85b179f4b6a191dd6ffad6
    camera_freq: 10.0
    camera_views: [CAMERA_RIGHT_FRONT, CAMERA_LEFT_FRONT, CAMERA_RIGHT_BACK, CAMERA_LEFT_BACK]
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0

model:
  model: NeckPPP
  image_size: 512
  mixed_precision: bf16
  resume_from: null
  extra:
    embed_dim: 384
    neck_layers: 12
    neck_heads: 6
    stem_channels: [32, 64, 128]
    stage_channels: [128, 64, 32, 16]
    local_refine_blocks: 2
    use_skip_connections: true

train:
  num_workers: 4
  seed: 42
  train_batch_size: 160
  num_epochs: 1
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    lr: 1.0e-3
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.01
  # Earlier cosine decay; final quarter stays at the minimum LR.
  lr_schedule: cosine_updates
  lr_schedule_args:
    num_warmup_steps: 200
    min_lr_ratio: 0.1
    decay_start_fraction: 0.0
    decay_end_fraction: 0.75
  auto_lr:
    rule: none
  log_interval: 1
  save_model_epochs: 0
  save_model_steps: 1000
  work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/NeckPPP_hardware_b160_w4
  online_metric: false
  extra:
    ppp_weight: 1.0
    rcs_weight: 1.0
    doppler_weight: 1.0
    normalize_ppp_by_gt_count: true
    velocity_loss_mode: signed_l1
    mark_link: identity
    conditioning_dropout: 0.0
    overfit_diagnostic_interval: 0
    lr_range_test: false
    keep_last_checkpoints: 5  # Retain only the latest five numbered checkpoints.
    prediction_interval: 0
    save_checkpoints: false
    log_step_timing: true
    prediction_random_sample: true

work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/NeckPPP_hardware_b160_w4
name: NeckPPP_hardware_b160_w4
tracker_project_name: train_radargen_ppp
report_to: none
resume_from: null

tensorboard: false
