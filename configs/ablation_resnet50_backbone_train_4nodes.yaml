# Standard ImageNet ResNet-50; stride-16, shared 2048→384 projection per modality.
# Same 12×1152 neck and standard 1024-output head as final DINO.
# First 12h production allocation; fresh ImageNet initialization, no PPP/LR-sweep transfer.
# Four nodes × four GPUs × batch 20 = effective batch 320; CLI cap 15,000 updates.
data:
  dataset_dir: /e/scratch/nxtaim-1/public/truckscenes/man-truckscenes
  ppp_data_dir: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  ppp_manifest_path: output/ppp_manifests/truckscenes_train.json
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenPPPDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.2-trainval
    ppp_scene_tokens: null
    ppp_processing_signature: 22b8e2aa32ac33f9ebd50fda28a5e1fde16df5377c85b179f4b6a191dd6ffad6
    camera_freq: 10.0
    camera_views: [CAMERA_RIGHT_FRONT, CAMERA_LEFT_FRONT, CAMERA_RIGHT_BACK, CAMERA_LEFT_BACK]
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0

model:
  model: ResNetPPP
  image_size: 512
  mixed_precision: bf16
  resume_from: null
  extra:
    model_name: resnet50
    checkpoint_path: output/pretrained_models/resnet50/resnet50-11ad3fa6.pth
    frozen_base: false
    projection_channels: 384
    embed_dim: 1152
    neck_layers: 12
    neck_heads: 9
    decoder: attention
    output_scale: 2
    attention_channels: [128, 64, 32]
    attention_blocks: 2
    attention_heads: 4
    attention_window_size: 8
    attention_projection_kernel_size: 3
    attention_shifted_windows: true

train:
  num_workers: 4
  seed: 42
  train_batch_size: 20
  num_epochs: 1000
  training_hours: 11.8
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    lr: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.01
  # 200 optimizer-update warmup, then constant 1e-4; no automatic LR scaling.
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 200
  auto_lr:
    rule: none
  log_interval: 20
  save_model_epochs: 0
  save_model_steps: 1000
  work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/ablation_resnet50_backbone_train_4nodes
  online_metric: false
  extra:
    ppp_weight: 1.0
    rcs_weight: 1.0
    doppler_weight: 1.0
    normalize_ppp_by_gt_count: true
    velocity_loss_mode: signed_l1
    mark_link: cubic
    conditioning_dropout: 0.0
    shuffle_each_epoch: true  # Global permutation with seed + zero-based epoch, then rank sharding.
    overfit_diagnostic_interval: 0
    lr_range_test: false
    save_checkpoints: true
    keep_last_checkpoints: 0  # Keep every checkpoint; no pruning.
    prediction_interval: 1000
    prediction_random_sample: true

work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/ablation_resnet50_backbone_train_4nodes
name: ablation_resnet50_backbone_train_4nodes
tracker_project_name: train_radargen_ppp
report_to: none
resume_from: null

# Write metrics and figures to <run directory>/tensorboard; no loose PNGs.
tensorboard: true
