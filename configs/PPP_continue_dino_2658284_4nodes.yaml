# Four-node weight continuation with fresh optimizer and 100-update warmup.
# 12-hour production run: fully trainable DINO/LoRA, 1152-wide neck, shifted 1024 decoder.
# 100-update linear warmup, then constant 1e-4; batch 24/GPU, continuous detections.
data:
  dataset_dir: /e/scratch/nxtaim-1/public/truckscenes/man-truckscenes
  ppp_data_dir: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  ppp_manifest_path: output/ppp_manifests/truckscenes_train.json
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenPPPDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.2-trainval
    ppp_scene_tokens: null
    ppp_processing_signature: 22b8e2aa32ac33f9ebd50fda28a5e1fde16df5377c85b179f4b6a191dd6ffad6
    camera_freq: 10.0
    camera_views: [CAMERA_RIGHT_FRONT, CAMERA_LEFT_FRONT, CAMERA_RIGHT_BACK, CAMERA_LEFT_BACK]
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0

model:
  model: DinoPPP
  image_size: 512
  mixed_precision: bf16
  resume_from: null
  extra:
    model_name: vit_small_patch16_dinov3
    checkpoint_path: /e/project1/nxtaim-1/huber7/pretrained/vit_small_patch16_dinov3.lvd1689m/model.safetensors
    # Train shared RGB DINO weights and retain the modality-specific LoRA adapters.
    frozen_base: false
    use_lora: true
    lora_r: 16
    lora_alpha: 32.0
    out_indices: [11]
    feature_fusion: last_concat
    embed_dim: 1152
    neck_layers: 12
    neck_heads: 9
    decoder: attention
    output_scale: 2
    attention_channels: [128, 64, 32]
    attention_blocks: 2
    attention_heads: 4
    attention_window_size: 8
    attention_projection_kernel_size: 3
    attention_shifted_windows: true
    local_refine_blocks: 2

train:
  training_hours: 11.8
  num_workers: 4
  seed: 42
  train_batch_size: 24
  num_epochs: 65
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    lr: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.01
  # Keep LR constant after a short warmup; Slurm bounds this run to 12 hours.
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 100
  auto_lr:
    rule: none
  log_interval: 20
  save_model_epochs: 0
  save_model_steps: 1000
  work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_train_dinov3_attention_1024_shifted_constant_1e4
  online_metric: false
  extra:
    ppp_weight: 1.0
    rcs_weight: 1.0
    doppler_weight: 1.0
    normalize_ppp_by_gt_count: true
    velocity_loss_mode: signed_l1
    mark_link: cubic
    conditioning_dropout: 0.0
    shuffle_each_epoch: true  # Global permutation with seed + zero-based epoch, then rank sharding.
    overfit_diagnostic_interval: 0
    lr_range_test: false
    save_checkpoints: true
    keep_last_checkpoints: 0  # Keep every checkpoint; no pruning.
    prediction_interval: 1000
    prediction_random_sample: true

work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_train_dinov3_attention_1024_shifted_constant_1e4
name: PPP_train_dinov3_attention_1024_shifted_constant_1e4
tracker_project_name: train_radargen_ppp
report_to: none
resume_from: null

# Write metrics and figures to <run directory>/tensorboard; no loose PNGs.
tensorboard: true
