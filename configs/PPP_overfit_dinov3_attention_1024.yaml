# Four fixed samples, full-backbone overfitting with 1152-channel neck and 1024 output.
# Batch 4, no accumulation; GPU peaks include backward and AdamW updates.
data:
  dataset_dir: /e/scratch/nxtaim-1/public/truckscenes/man-truckscenes
  ppp_data_dir: /e/scratch/nxtaim-1/public/truckscenes/RadarGen_preprocessed
  ppp_manifest_path: output/ppp_manifests/truckscenes_dino_attention_overfit.json
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenPPPDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.2-trainval
    ppp_scene_tokens: [018a60086f5e441fb09f476e55948b72]
    ppp_subset_indices: [0, 32, 64, 96]
    ppp_processing_signature: 22b8e2aa32ac33f9ebd50fda28a5e1fde16df5377c85b179f4b6a191dd6ffad6
    camera_freq: 10.0
    camera_views: [CAMERA_RIGHT_FRONT, CAMERA_LEFT_FRONT, CAMERA_RIGHT_BACK, CAMERA_LEFT_BACK]
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0

model:
  model: DinoPPP
  image_size: 512
  mixed_precision: bf16
  resume_from: null
  extra:
    model_name: vit_small_patch16_dinov3
    checkpoint_path: /e/project1/nxtaim-1/huber7/pretrained/vit_small_patch16_dinov3.lvd1689m/model.safetensors
    # Train shared RGB DINO weights and retain the modality-specific LoRA adapters.
    frozen_base: false
    use_lora: true
    lora_r: 16
    lora_alpha: 32.0
    out_indices: [11]
    feature_fusion: last_concat
    embed_dim: 1152
    neck_layers: 12
    neck_heads: 9
    decoder: attention
    output_scale: 2
    attention_channels: [128, 64, 32]
    attention_blocks: 2
    attention_heads: 4
    attention_window_size: 8
    local_refine_blocks: 2

train:
  num_workers: 0
  seed: 42
  train_batch_size: 4
  num_epochs: 1000
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    lr: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.01
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 20
  auto_lr:
    rule: none
  log_interval: 10
  save_model_epochs: 0
  save_model_steps: 250
  work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_overfit_dinov3_attention_1024
  online_metric: false
  extra:
    ppp_weight: 1.0
    rcs_weight: 1.0
    doppler_weight: 1.0
    normalize_ppp_by_gt_count: true
    velocity_loss_mode: signed_l1
    conditioning_dropout: 0.0
    overfit_diagnostic_interval: 100
    log_step_timing: true
    lr_range_test: false
    keep_last_checkpoints: 2  # Retain only the latest five numbered checkpoints.
    prediction_interval: 0
    prediction_random_sample: false

work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_overfit_dinov3_attention_1024
name: PPP_overfit_dinov3_attention_1024
tracker_project_name: train_radargen_ppp
report_to: none
resume_from: null

# Keep PNG and per-detection diagnostics in overfit_diagnostics/.
tensorboard: false
