# PPP_LR_range_frozen_decoder variant: frozen decoder, LR range test, four GPUs, batch 5/GPU.
# LR sweep: 5e-6 to 1e-3 over 2000 updates; no warmup or checkpoints.
data:
  dataset_dir: "/e/scratch/nxtaim-1/public/truckscenes/man-truckscenes"  # Where the TruckScenes dataset lives
  ppp_data_dir: "/e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/preprocessing/full/hdf5_samples"
  ppp_manifest_path: output/ppp_manifests/truckscenes_train.json
  image_size: 512
  load_text_feat: false
  load_vae_feat: false
  type: RadarGenPPPDatasetWrapper
  sort_dataset: false
  extra:
    dataset_name: truckscenes
    eval_split: train
    dataset_version: v1.2-trainval
    # Full adapter-selected illuminated training split; all corresponding HDF5 scenes are required.
    ppp_scene_tokens: null
    # Producer configuration + hdf5_4nodes_runner.py + hdf5_samples.py SHA256.
    ppp_processing_signature: 22b8e2aa32ac33f9ebd50fda28a5e1fde16df5377c85b179f4b6a191dd6ffad6
    camera_freq: 10.0  # Confirmed in smoke metadata/normalization_json
    camera_views: ['CAMERA_RIGHT_FRONT', 'CAMERA_LEFT_FRONT', 'CAMERA_RIGHT_BACK', 'CAMERA_LEFT_BACK']
    coordinate_range: 50.0
    rcs_min: -20.0
    rcs_max: 66.0
    doppler_min: -120.0
    doppler_max: 120.0
# model config
model:
  model: RadarGenPPP_600M_P1_D28
  image_size: 512
  mixed_precision: bf16
  fp32_attention: true
  load_from: /e/project1/nxtaim-1/huber7/pretrained/Sana_600M_512px/checkpoints/Sana_600M_512px_MultiLing.pth
  resume_from:
  aspect_ratio_type: ASPECT_RATIO_512
  attn_type: linear
  ffn_type: glumbconv
  mlp_acts:
    - silu
    - silu
    - null
  mlp_ratio: 2.5
  use_pe: true
  qk_norm: true
  class_dropout_prob: 0.1
  pag_applied_layers: []
  extra:
    num_maps: 3
    num_conditions: 3
    fixed_timestep: 0.0
vae:
  vae_type: dc-ae
  vae_pretrained: /e/project1/nxtaim-1/huber7/pretrained/dc-ae-f32c32-sana-1.1/
  weight_dtype: float32
  scale_factor: 0.41407
  vae_latent_dim: 32
  vae_downsample_rate: 32
  sample_posterior: true
text_encoder:
  text_encoder_name: gemma-2-2b-it
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  # CHI
  chi_prompt: []
scheduler:
  predict_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  flow_shift: 3.0
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver
train:
  num_workers: 10  # Per GPU process: 40 loader workers across four GPUs.
  seed: 42
  train_batch_size: 5
  num_epochs: 300
  gradient_accumulation_steps: 1
  grad_checkpointing: true
  gradient_clip: 0.1
  optimizer:
    betas:
      - 0.9
      - 0.999
      - 0.9999
    eps:
      - 1.0e-30
      - 1.0e-16
    lr: 5.0e-6
    type: CAMEWrapper
    weight_decay: 0.0
  lr_schedule: exponential
  lr_schedule_args:
    end_lr: 0.001
    updates: 2000
  log_interval: 1
  save_model_epochs: 0
  save_model_steps: 5000  # Checkpoint saving disabled by lr_range_test.
  # An empty mapping is dropped by Pyrallis, restoring its sqrt default.
  auto_lr:
    rule: none
  work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_LR_range_frozen_decoder
  online_metric: false
  eval_metric_step: 5000
  online_metric_dir: metric_helper
  # Initial diagnostic loss weights; physical PPP marks are not rescaled.
  extra:
    ppp_weight: 1.0
    rcs_weight: 1.0
    doppler_weight: 1.0
    normalize_ppp_by_gt_count: true
    velocity_loss_mode: signed_l1
    conditioning_dropout: 0.1
    overfit_diagnostic_interval: 0
    keep_last_checkpoints: 3  # Retain the latest three numbered checkpoints.
    freeze_decoder: true
    lr_range_test: true
    prediction_interval: 100
    prediction_random_sample: true

# Scheduler block is retained for SanaConfig compatibility, not used by PPP.
work_dir: /e/scratch/nxtaim-1/huber7/work_dirs_RadarGen/train/PPP_LR_range_frozen_decoder
name: PPP_LR_range_frozen_decoder
tracker_project_name: train_radargen_ppp
report_to: none  # TensorBoard diagnostics will be added separately.
